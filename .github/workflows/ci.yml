name: spp-telemetry CI
on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Execute tests (compiler=${{ matrix.compiler }}, preset=${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [ g++, clang++ ]
        preset: [ debug, san ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  lint:
    name: Lint sources
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: clang-tidy-18 version
        run: clang-tidy-18 --version

      - name: Configure
        run: cmake --preset tidy

      - name: Build
        run: cmake --build --preset tidy

  format:
    name: Check source formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: clang-format-18 version
        run: clang-format-18 --version

      - name: Check formatting
        run: tools/format.sh --check
